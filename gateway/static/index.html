<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim-Twin F1 | J.A.R.V.I.S.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root {
  --cy: #00e5ff; --cy-dim: rgba(0, 229, 255, 0.35); --bg: #02070d; --panel: rgba(2, 14, 22, 0.58);
  --warn: #ff9d00; --bad: #ff3b5c; --ok: #38f2a0; --txt: #bfefff;
  --display: "Orbitron", system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; font-family: var(--mono); }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.panel {
  position: absolute; padding: 12px 14px; background: var(--panel); border: 1px solid var(--cy-dim);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.title { font-family: var(--display); font-size: 0.7rem; letter-spacing: 0.22em; color: var(--cy); text-transform: uppercase; margin-bottom: 8px; }
.big { font-family: var(--display); color: #fff; text-shadow: 0 0 12px var(--cy); }
#brand { top: 14px; left: 14px; min-width: 230px; }
#brand .name { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.18em; color: #fff; text-shadow: 0 0 14px var(--cy); }
#brand .sub { font-size: 0.78rem; color: var(--txt); opacity: 0.8; margin-top: 2px; }
#status { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.78rem; }
#status i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad); }
#status.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
#drivers { top: 128px; left: 14px; width: 150px; max-height: calc(100% - 330px); overflow-y: auto; }
#drivers button {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 4px; background: none; border: 0;
  border-left: 3px solid transparent; color: var(--txt); font: inherit; font-size: 0.82rem; cursor: pointer; text-align: left;
}
#drivers button:hover { background: rgba(0, 229, 255, 0.08); }
#drivers button.sel { background: rgba(0, 229, 255, 0.16); border-left-color: var(--cy); color: #fff; }
#drivers button:focus-visible, .btn:focus-visible { outline: 2px solid var(--cy); outline-offset: 1px; }
#drivers .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
#drivers .kmh { margin-left: auto; opacity: 0.7; font-size: 0.74rem; }
#events { top: 14px; right: 14px; width: 330px; max-width: 40vw; }
#events .ev { font-size: 0.78rem; line-height: 1.35; margin-bottom: 5px; padding-left: 8px; border-left: 2px solid var(--cy-dim); }
#events .ev.flag { border-left-color: var(--warn); } #events .ev.bad { border-left-color: var(--bad); }
#predict { top: 50%; right: 14px; transform: translateY(-50%); width: 270px; }
#predict .row { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0; gap: 8px; }
#predict .lab { font-size: 0.72rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.1em; }
#predict .val { font-family: var(--display); font-size: 1.1rem; color: #fff; text-shadow: 0 0 10px var(--cy); }
.bar { height: 8px; background: rgba(0, 229, 255, 0.12); border: 1px solid var(--cy-dim); position: relative; }
.bar > b { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--cy); box-shadow: 0 0 10px var(--cy); transition: width 0.25s; }
#wearbar > b { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
#pit { margin-top: 10px; padding: 8px; text-align: center; font-family: var(--display); font-size: 0.78rem; letter-spacing: 0.12em;
  border: 1px solid var(--cy-dim); color: var(--ok); }
#pit.alert { color: #fff; background: rgba(255, 59, 92, 0.25); border-color: var(--bad); animation: blink 0.9s infinite; }
@keyframes blink { 50% { box-shadow: 0 0 18px var(--bad); } }
#mc { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--cy-dim); }
#mc .val { font-size: 0.95rem; }
#mcsvg { display: block; width: 100%; height: auto; margin-top: 6px; }
#mcsvg text { fill: var(--txt); font: 9px var(--mono); opacity: 0.75; }
#mcsvg .zero { stroke: var(--cy-dim); stroke-dasharray: 3 3; }
#mcsvg .area { fill: rgba(0, 229, 255, 0.14); }
#mcsvg .line { fill: none; stroke: var(--cy); stroke-width: 1.5; }
#mcsvg .best { fill: var(--ok); }
#mcsvg .bestline { stroke: var(--ok); stroke-width: 1; opacity: 0.6; }
#cluster { bottom: 14px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 28px)); display: grid;
  grid-template-columns: auto 1fr auto; gap: 8px 18px; align-items: center; }
#speed { font-size: 3rem; line-height: 1; }
#speed small { font-size: 0.8rem; opacity: 0.7; margin-left: 4px; }
#gear { font-size: 2.2rem; text-align: center; }
.bars { display: grid; gap: 8px; }
.bars .l { font-size: 0.68rem; letter-spacing: 0.12em; opacity: 0.75; margin-bottom: 2px; }
#brkbar > b { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
#rpmbar > b { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
#lastlap { font-size: 0.78rem; opacity: 0.85; text-align: right; }
#console { bottom: 14px; left: 14px; width: 330px; max-width: 28vw; min-height: 120px; }
#console .line { font-size: 0.8rem; line-height: 1.4; margin-bottom: 4px; opacity: 0.6; }
#console .line:last-child { opacity: 1; color: #fff; }
#console .line b { color: var(--cy); font-weight: normal; }
#controls { bottom: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; width: 260px; }
.btn { font: inherit; font-size: 0.78rem; color: var(--cy); background: rgba(0, 229, 255, 0.08); border: 1px solid var(--cy-dim); padding: 6px 10px; cursor: pointer; }
.btn:hover { background: rgba(0, 229, 255, 0.2); }
.btn[aria-pressed="true"] { background: var(--cy); color: #001018; }
.label { position: fixed; left: 0; top: 0; pointer-events: none; font-size: 0.72rem; padding: 1px 5px; background: rgba(2, 14, 22, 0.7);
  border: 1px solid; white-space: nowrap; will-change: transform; }
.label.sel { color: #fff; box-shadow: 0 0 10px var(--cy); }
#wait { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
#wait div { font-family: var(--display); letter-spacing: 0.2em; color: var(--cy); text-shadow: 0 0 14px var(--cy); animation: pulse 1.6s infinite; }
#wait small { display: block; margin-top: 10px; font-family: var(--mono); letter-spacing: 0.05em; opacity: 0.7; }
@keyframes pulse { 50% { opacity: 0.45; } }
@media (max-width: 900px) {
  #console, #events { display: none; }
  #predict { top: auto; bottom: 150px; transform: none; right: 8px; width: 210px; }
  #mc { display: none; }
  #drivers { width: 112px; top: 112px; }
  #speed { font-size: 2.2rem; }
  #controls { bottom: auto; top: 14px; right: 14px; width: auto; }
}
@media (prefers-reduced-motion: reduce) { #wait div, #pit.alert { animation: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>

<div id="wait"><div>AWAITING TELEMETRY<small id="waitmsg">Start the stack: docker compose up -d --build</small></div></div>

<section class="panel" id="brand">
  <div class="name">J.A.R.V.I.S.</div>
  <div class="sub" id="circuit">Loading circuit...</div>
  <div id="status"><i></i><span>LINK OFFLINE</span></div>
</section>

<section class="panel" id="drivers" aria-label="Drivers"><div class="title">Drivers</div><div id="drvlist"></div></section>

<section class="panel" id="events" aria-live="polite"><div class="title">Race control</div><div id="evlist"><div class="ev">No messages yet.</div></div></section>

<section class="panel" id="predict" aria-label="Predictions">
  <div class="title">Predictions <span id="pdrv"></span></div>
  <div class="row"><span class="lab">Next lap</span><span class="val" id="pnext">--</span></div>
  <div class="row"><span class="lab">Tyre wear</span><span class="val" id="pwear">--</span></div>
  <div class="bar" id="wearbar"><b></b></div>
  <div class="row"><span class="lab">Laps to limit</span><span class="val" id="pleft">--</span></div>
  <div id="pit">TYRES OK</div>
  <div id="mc" hidden>
    <div class="title">Monte Carlo strategy</div>
    <div class="row"><span class="lab">Best stop</span><span class="val" id="mcbest">--</span></div>
    <div class="row"><span class="lab">Saves</span><span class="val" id="mcgain">--</span></div>
    <div class="row"><span class="lab">In</span><span class="val" id="mcprob">--</span></div>
    <svg id="mcsvg" viewBox="0 0 240 78" role="img" aria-label="Seconds saved by stopping on each lap"></svg>
  </div>
</section>

<section class="panel" id="cluster" aria-label="Telemetry">
  <div class="big" id="speed"><span id="spv">0</span><small>km/h</small></div>
  <div class="bars">
    <div><div class="l">THROTTLE</div><div class="bar" id="thrbar"><b></b></div></div>
    <div><div class="l">BRAKE</div><div class="bar" id="brkbar"><b></b></div></div>
    <div><div class="l">RPM</div><div class="bar" id="rpmbar"><b></b></div></div>
  </div>
  <div><div class="big" id="gear">N</div><div id="lastlap">LAST --</div></div>
</section>

<section class="panel" id="console" aria-live="polite"><div class="title">Assistant</div><div id="clines"></div></section>

<div class="panel" id="controls">
  <button class="btn" id="viewbtn" type="button" aria-pressed="false">VIEW: CHASE (V)</button>
  <button class="btn" id="fxbtn" type="button" aria-pressed="true">FX: ON (F)</button>
  <button class="btn" id="voicebtn" type="button" aria-pressed="false">VOICE (M)</button>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = (id) => document.getElementById(id);
const M = 0.1; // OpenF1 positions are in decimetres

// ---------- scene ----------
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const HORIZON = 0x07202e;
const scene = new THREE.Scene();
scene.background = new THREE.Color(HORIZON);
scene.fog = new THREE.FogExp2(HORIZON, 0.00042);
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 20000);
camera.position.set(0, 600, 900);
scene.add(new THREE.HemisphereLight(0x9fdcff, 0x0b1a14, 0.75));
scene.add(new THREE.AmbientLight(0x6fa8c0, 0.35));
const sun = new THREE.DirectionalLight(0xcfeaff, 1.5); sun.position.set(300, 800, 200); scene.add(sun);

// ---------- procedural textures (no image files to load) ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return t;
}
function grain(ctx, w, h, n, base, spread, alpha = 0.5) {
  for (let i = 0; i < n; i++) {
    const v = base + (Math.random() - 0.5) * spread;
    ctx.fillStyle = `rgba(${v},${v},${v},${alpha})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
  }
}
const TEX = {
  asphalt: canvasTex(256, 512, (ctx, w, h) => {      // u across the track, v along it
    ctx.fillStyle = "#3a4047"; ctx.fillRect(0, 0, w, h);
    grain(ctx, w, h, 9000, 92, 60, 0.5);
    for (const cx of [0.3, 0.7]) {                    // rubbered racing line
      const g = ctx.createLinearGradient((cx - 0.12) * w, 0, (cx + 0.12) * w, 0);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, "rgba(0,0,0,0.32)"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
  }),
  kerb: canvasTex(64, 128, (ctx, w, h) => {
    ctx.fillStyle = "#d3202a"; ctx.fillRect(0, 0, w, h / 2);
    ctx.fillStyle = "#f2f2f2"; ctx.fillRect(0, h / 2, w, h / 2);
    grain(ctx, w, h, 500, 120, 90, 0.18);
  }),
  grass: canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = "#16301f"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 5000; i++) {
      const g = 48 + Math.random() * 40;
      ctx.fillStyle = `rgba(${g * 0.45},${g},${g * 0.5},0.45)`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 1, 2 + Math.random() * 3);
    }
  }),
  wall: canvasTex(128, 32, (ctx, w, h) => {           // stacked tyres with a white band
    ctx.fillStyle = "#101214"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#e8eef2"; ctx.fillRect(0, h * 0.4, w, h * 0.2);
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    for (let x = 0; x < w; x += 16) ctx.fillRect(x, 0, 2, h);
  }),
  checker: canvasTex(128, 32, (ctx, w, h) => {
    const s = 16;
    for (let y = 0; y < h / s; y++) for (let x = 0; x < w / s; x++) { ctx.fillStyle = (x + y) % 2 ? "#0a0a0a" : "#f4f4f4"; ctx.fillRect(x * s, y * s, s, s); }
  }),
  glow: canvasTex(128, 128, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.35, "rgba(255,255,255,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }, false),
  sky: canvasTex(2048, 1024, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#01040a"); g.addColorStop(0.55, "#06182a"); g.addColorStop(0.82, "#0e4258"); g.addColorStop(1, "#12586e");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) {
      const y = Math.pow(Math.random(), 1.8) * h * 0.62, a = 0.15 + Math.random() * 0.4;
      ctx.fillStyle = `rgba(220,240,255,${a})`; ctx.fillRect(Math.random() * w, y, 1, 1);
    }
  }, false),
};
TEX.asphalt.wrapS = THREE.ClampToEdgeWrapping;

const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 32, 16),
  new THREE.MeshBasicMaterial({ map: TEX.sky, side: THREE.BackSide, fog: false, depthWrite: false }));
sky.renderOrder = -1; scene.add(sky);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.4; controls.enabled = false;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.6, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// ---------- world coordinates ----------
let origin = { x: 0, y: 0, z: 0 };
let trackReady = false;
const toWorld = (x, y, z) => new THREE.Vector3(x * M - origin.x, z * M - origin.z, -(y * M - origin.y));

function buildTrack(pts) {
  const n = pts.length;
  origin = { x: pts.reduce((a, p) => a + p[0], 0) / n * M, y: pts.reduce((a, p) => a + p[1], 0) / n * M, z: pts.reduce((a, p) => a + p[2], 0) / n * M };
  const curve = new THREE.CatmullRomCurve3(pts.map((p) => toWorld(p[0], p[1], p[2])), true, "centripetal");
  const N = 900, W = 7;
  const P = curve.getSpacedPoints(N);                 // N + 1 points, the last one repeats the first
  const T = [], nrm = [];
  for (let i = 0; i < N; i++) {
    const t = curve.getTangentAt(i / N); T.push(t);
    nrm.push(new THREE.Vector3(-t.z, 0, t.x).normalize()); // +nrm = left of the direction of travel
  }
  T.push(T[0]); nrm.push(nrm[0]);
  const dist = [0];
  for (let i = 1; i <= N; i++) dist.push(dist[i - 1] + P[i].distanceTo(P[i - 1]));

  // Flat band between two lateral offsets o1 < o2 from the centre line. keep[i] picks which segments exist.
  function strip(o1, o2, dy, mat, { uRepeat = 0, vLen = 10, keep = null, c1 = 1, c2 = 1, shade = null } = {}) {
    const pos = [], nor = [], uv = [], col = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const p = P[i], m = nrm[i], v = dist[i] / vLen, sh = shade ? shade(i) : 1;
      [[o1, c1, 0], [o2, c2, 1]].forEach(([o, c, side]) => {
        pos.push(p.x + m.x * o, p.y + dy, p.z + m.z * o); nor.push(0, 1, 0); col.push(c * sh, c * sh, c * sh);
        uv.push(uRepeat ? o / uRepeat : side, v);
      });
    }
    for (let i = 0; i < N; i++) if (!keep || keep[i]) { const a = i * 2, b = a + 2; idx.push(a, a + 1, b, a + 1, b + 1, b); }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    const mesh = new THREE.Mesh(g, mat); scene.add(mesh); return mesh;
  }
  // Vertical barrier at lateral offset o, h metres high, facing the track.
  function wall(o, h, mat, vLen = 6) {
    const pos = [], nor = [], uv = [], idx = [], s = -Math.sign(o);
    for (let i = 0; i <= N; i++) {
      const p = P[i], m = nrm[i], x = p.x + m.x * o, z = p.z + m.z * o, u = dist[i] / vLen;
      pos.push(x, p.y, z, x, p.y + h, z); nor.push(m.x * s, 0, m.z * s, m.x * s, 0, m.z * s); uv.push(u, 0, u, 1);
    }
    for (let i = 0; i < N; i++) { const a = i * 2, b = a + 2; idx.push(a, a + 1, b, a + 1, b + 1, b); }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    scene.add(new THREE.Mesh(g, mat));
  }
  const dbl = (o) => new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, ...o });

  // ground, runoff and asphalt
  const minY = Math.min(...P.map((p) => p.y));
  TEX.grass.repeat.set(500, 500);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshStandardMaterial({ map: TEX.grass, roughness: 1, color: 0xa6bfae }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = minY - 4; scene.add(ground);
  const grass = dbl({ map: TEX.grass, vertexColors: true, roughness: 1 });
  strip(W, W + 24, -0.08, grass, { uRepeat: 12, vLen: 12, c1: 1, c2: 0.35 });
  strip(-W - 24, -W, -0.08, grass, { uRepeat: 12, vLen: 12, c1: 0.35, c2: 1 });
  strip(-W, W, 0, dbl({ map: TEX.asphalt, roughness: 0.85, metalness: 0.05 }), { vLen: 22 });

  // kerbs on the inside of every corner (where the heading changes fast)
  const dilate = (a, r) => a.map((_, i) => { for (let k = -r; k <= r; k++) if (a[(i + k + N) % N]) return true; return false; });
  const left = new Array(N).fill(false), right = new Array(N).fill(false);
  for (let i = 0; i < N; i++) {
    const turn = T[i].x * T[i + 1].z - T[i].z * T[i + 1].x;
    if (turn > 0.026) left[i] = true; else if (turn < -0.026) right[i] = true;
  }
  const kerb = dbl({ map: TEX.kerb, roughness: 0.7 });
  strip(W - 0.1, W + 1.5, 0.045, kerb, { vLen: 2.6, keep: dilate(left, 4) });
  strip(-W - 1.5, -W + 0.1, 0.045, kerb, { vLen: 2.6, keep: dilate(right, 4) });
  const line = new THREE.MeshStandardMaterial({ color: 0xe8eef2, roughness: 0.6, side: THREE.DoubleSide });
  strip(W - 0.55, W - 0.3, 0.03, line); strip(-W + 0.3, -W + 0.55, 0.03, line);

  // tyre walls on both sides
  const wallMat = dbl({ map: TEX.wall, roughness: 0.9 });
  wall(W + 25, 1.4, wallMat); wall(-W - 25, 1.4, wallMat);

  // neon edge lines: the digital-twin look
  const edge = new THREE.LineBasicMaterial({ color: 0x00e5ff });

function makeCar(hex) {
  const C = carParts(), col = new THREE.Color(hex);
  const paint = new THREE.MeshPhysicalMaterial({ color: col, emissive: col, emissiveIntensity: 0.1, metalness: 0.45, roughness: 0.28, clearcoat: 0.9, clearcoatRoughness: 0.15 });
  const brakeMat = new THREE.MeshBasicMaterial({ color: 0x3a0508 });                    // rear light
  const glow = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xff5a10, emissiveIntensity: 0 }); // hot brake discs
  const g = new THREE.Group(), wheels = [];
  const put = (geo, mat, x, y, z, rx = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.x = rx; g.add(m); return m; };

  put(C.body, paint, 0, 0.5, 0);
  [-1, 1].forEach((s) => put(C.pod, paint, s * 0.62, 0.42, -0.25));
  put(C.cover, paint, 0, 0.86, -0.85);
  put(C.floor, C.carbon, 0, 0.17, -0.2);
  put(C.diffuser, C.carbon, 0, 0.26, -2.4);
  put(C.helmet, new THREE.MeshStandardMaterial({ color: 0xf2f4f6, roughness: 0.3 }), 0, 0.82, 0.5);
  put(C.halo, C.carbon, 0, 0.8, 0.52).rotation.set(0, 0, 0);
  // front wing: carbon plane, painted flap, end plates
  put(C.fwMain, C.carbon, 0, 0.2, 2.9);
  put(C.fwFlap, paint, 0, 0.27, 2.72, -0.15);
  [-1, 1].forEach((s) => put(C.fwEnd, paint, s * 1.1, 0.3, 2.85));
  // rear wing
  put(C.rwMain, C.carbon, 0, 1.02, -2.3);
  put(C.rwMain, paint, 0, 0.84, -2.25);
  [-1, 1].forEach((s) => put(C.rwEnd, paint, s * 0.78, 0.82, -2.3));
  put(C.rwPost, C.carbon, 0, 0.62, -2.28);
  put(C.light, brakeMat, 0, 0.5, -2.6);
  // wheels: a pivot you can spin, with tyre, five-sided rim and a disc that glows under braking
  [[1.75, 0.98, C.tyreF, C.rimF], [-1.45, 1.05, C.tyreR, C.rimR]].forEach(([z, x, tyre, rim]) => [-1, 1].forEach((s) => {
    const pivot = new THREE.Group(); pivot.position.set(s * x, 0.36, z);

// ---------- effects: light trails and brake sparks ----------
let fx = true;
const TRAIL_N = 64, SLOW = new THREE.Color(0x1d4fff);

// A ribbon on the ground behind each car, brighter and in team colour the faster the car goes.
function makeTrail(hex) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 6), 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 6), 3).setUsage(THREE.DynamicDrawUsage));
  const idx = [];
  for (let i = 0; i < TRAIL_N - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, pts: [], acc: 0, color: new THREE.Color(hex), tmp: new THREE.Color() };
}
function updateTrail(c, speed, dt) {
  const tr = c.trail;
  tr.mesh.visible = fx;
  if (!fx) return;
  tr.acc += dt;
  const head = tr.pts[0];
  if (tr.acc > 1 / 30 && (!head || Math.hypot(c.pos.x - head.x, c.pos.z - head.z) > 0.4)) {
    tr.acc = 0;
    tr.pts.unshift({ x: c.pos.x, y: c.pos.y, z: c.pos.z, nx: Math.cos(c.heading), nz: -Math.sin(c.heading), s: Math.min(1, speed / 330) });
    if (tr.pts.length > TRAIL_N) tr.pts.pop();
  }
  if (tr.pts.length < 2) return;
  const pos = tr.mesh.geometry.attributes.position, col = tr.mesh.geometry.attributes.color;
  for (let i = 0; i < TRAIL_N; i++) {
    const p = tr.pts[Math.min(i, tr.pts.length - 1)], k = i / TRAIL_N;
    const w = 0.4 * (1 - k * 0.6), fade = Math.pow(1 - k, 2.2) * (i < tr.pts.length ? 0.6 : 0);
    tr.tmp.copy(SLOW).lerp(tr.color, p.s).multiplyScalar(fade * (0.3 + p.s * 0.55));
    pos.setXYZ(i * 2, p.x + p.nx * w, p.y + 0.3, p.z + p.nz * w);
    pos.setXYZ(i * 2 + 1, p.x - p.nx * w, p.y + 0.3, p.z - p.nz * w);
    col.setXYZ(i * 2, tr.tmp.r, tr.tmp.g, tr.tmp.b); col.setXYZ(i * 2 + 1, tr.tmp.r, tr.tmp.g, tr.tmp.b);
  }
  pos.needsUpdate = true; col.needsUpdate = true;
}

// Sparks thrown off under heavy braking: one shared pool of points.
const SP = 400, spPos = new Float32Array(SP * 3), spCol = new Float32Array(SP * 3), spVel = new Float32Array(SP * 3), spLife = new Float32Array(SP);
const spGeo = new THREE.BufferGeometry();
spGeo.setAttribute("position", new THREE.BufferAttribute(spPos, 3).setUsage(THREE.DynamicDrawUsage));
spGeo.setAttribute("color", new THREE.BufferAttribute(spCol, 3).setUsage(THREE.DynamicDrawUsage));
const sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({ size: 0.55, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, map: TEX.glow }));
sparks.frustumCulled = false; scene.add(sparks);
let spNext = 0;
function emitSpark(x, y, z, fx_, fz_) {
  const i = spNext; spNext = (spNext + 1) % SP;
  spPos[i * 3] = x + (Math.random() - 0.5) * 2.4; spPos[i * 3 + 1] = y + 0.25; spPos[i * 3 + 2] = z + (Math.random() - 0.5) * 2.4;
  spVel[i * 3] = -fx_ * 5 + (Math.random() - 0.5) * 5; spVel[i * 3 + 1] = 1.5 + Math.random() * 4; spVel[i * 3 + 2] = -fz_ * 5 + (Math.random() - 0.5) * 5;
  spLife[i] = 0.5 + Math.random() * 0.5;
}
function updateSparks(dt) {
  sparks.visible = fx;
  if (!fx) return;
  for (let i = 0; i < SP; i++) {
    if (spLife[i] <= 0) { spCol[i * 3] = spCol[i * 3 + 1] = spCol[i * 3 + 2] = 0; continue; }
    spLife[i] -= dt; spVel[i * 3 + 1] -= 14 * dt;
    spPos[i * 3] += spVel[i * 3] * dt; spPos[i * 3 + 1] = Math.max(spPos[i * 3 + 1] + spVel[i * 3 + 1] * dt, 0.2); spPos[i * 3 + 2] += spVel[i * 3 + 2] * dt;
    const l = Math.max(spLife[i], 0);
    spCol[i * 3] = 1.2 * l * 1.6; spCol[i * 3 + 1] = 0.55 * l * 1.6; spCol[i * 3 + 2] = 0.12 * l * 1.6;
  }
  spGeo.attributes.position.needsUpdate = true; spGeo.attributes.color.needsUpdate = true;
}

const cars = new Map();       // code -> { group, pos, target, last, heading, want, color, label }
const info = new Map();       // code -> { colour, team, name }
const tel = {}, preds = {}, lastLap = {};
let selected = null;

function ensureCar(code) {
  if (cars.has(code)) return cars.get(code);
  const meta = info.get(code) || { colour: "#cfefff" };
  const group = makeCar(meta.colour);
  scene.add(group);
  const label = document.createElement("div");
  label.className = "label"; label.textContent = code; label.style.borderColor = meta.colour; label.style.color = meta.colour;
  $("labels").appendChild(label);
  const c = { group, pos: new THREE.Vector3(), target: new THREE.Vector3(), last: null, heading: 0, want: 0, label, fresh: true, trail: makeTrail(meta.colour) };
  cars.set(code, c);
  renderDrivers();
  if (!selected) select(code);
  return c;
}

function onPosition(d) {
  if (!trackReady) return;
  const c = ensureCar(d.driver);
  const t = toWorld(d.x, d.y, d.z);
  if (c.last) {
    const dx = t.x - c.last.x, dz = t.z - c.last.z;
    if (dx * dx + dz * dz > 0.64) c.want = Math.atan2(dx, dz);
  }
  c.last = t.clone(); c.target.copy(t);
  if (c.fresh) { c.pos.copy(t); c.fresh = false; $("wait").style.display = "none"; }
}

const lerpAngle = (a, b, k) => a + (((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * k;

// ---------- camera modes ----------
let mode = "chase";
function setMode(m) {
  mode = m;
  controls.enabled = m === "orbit"; controls.autoRotate = m === "orbit";
  if (m === "orbit") { camera.position.set(0, 700, 900); controls.target.set(0, 0, 0); }
  $("viewbtn").textContent = "VIEW: " + (m === "chase" ? "CHASE" : "ORBIT") + " (V)";
  $("viewbtn").setAttribute("aria-pressed", String(m === "orbit"));
}
$("viewbtn").addEventListener("click", () => setMode(mode === "chase" ? "orbit" : "chase"));

// ---------- HUD ----------
const fmtTime = (s) => { const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(3).padStart(6, "0"); };
const set = (id, v) => { const e = $(id); if (e.textContent !== v) e.textContent = v; };
const bar = (id, pct) => { $(id).firstElementChild.style.width = Math.max(0, Math.min(100, pct)) + "%"; };

function renderDrivers() {
  const list = $("drvlist"); list.innerHTML = "";
  [...cars.keys()].sort().forEach((code) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.code = code;
    if (code === selected) b.className = "sel";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = (info.get(code) || {}).colour || "#fff";
    const name = document.createElement("span"); name.textContent = code;
    const k = document.createElement("span"); k.className = "kmh"; k.id = "k-" + code; k.textContent = "--";
    b.append(dot, name, k); b.addEventListener("click", () => select(code)); list.appendChild(b);
  });
}

function select(code) {
  selected = code;
  document.querySelectorAll("#drvlist button").forEach((b) => b.classList.toggle("sel", b.dataset.code === code));
  cars.forEach((c, k) => c.label.classList.toggle("sel", k === code));

  say(`Tracking ${code}.`);
}

// ---------- assistant (console + optional voice) ----------
let voiceOn = false, lastSpoken = 0, typing = null;
function say(text, speak = false) {
  const lines = $("clines");
  const line = document.createElement("div"); line.className = "line";
  line.innerHTML = "<b>&gt;</b> "; lines.appendChild(line);
  while (lines.children.length > 5) lines.removeChild(lines.firstChild);
  const node = document.createTextNode(""); line.appendChild(node);
  clearInterval(typing); let i = 0;
  typing = setInterval(() => { node.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 14);
  if (speak && voiceOn && "speechSynthesis" in window && Date.now() - lastSpoken > 4000) {
    lastSpoken = Date.now(); speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; u.pitch = 0.9; speechSynthesis.speak(u);
  }
}
function toggleVoice() {
  voiceOn = !voiceOn; $("voicebtn").setAttribute("aria-pressed", String(voiceOn));
  say(voiceOn ? "Voice channel enabled." : "Voice channel muted.", voiceOn);
}
$("voicebtn").addEventListener("click", toggleVoice);
function toggleFx() {
  fx = !fx; $("fxbtn").textContent = "FX: " + (fx ? "ON" : "OFF") + " (F)"; $("fxbtn").setAttribute("aria-pressed", String(fx));
}
$("fxbtn").addEventListener("click", toggleFx);
addEventListener("keydown", (e) => {
  if (e.key === "v" || e.key === "V") setMode(mode === "chase" ? "orbit" : "chase");
  else if (e.key === "m" || e.key === "M") toggleVoice();
  else if (e.key === "f" || e.key === "F") toggleFx();
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const codes = [...cars.keys()].sort(); if (!codes.length) return;
    const i = codes.indexOf(selected), step = e.key === "ArrowRight" ? 1 : -1;
    select(codes[(i + step + codes.length) % codes.length]);
  }
});

// ---------- live messages ----------
function addEvent(d) {
  const list = $("evlist");
  if (list.firstElementChild && list.firstElementChild.textContent === "No messages yet.") list.innerHTML = "";
  const e = document.createElement("div"); const msg = d.message || d.category || "";
  const bad = /RED FLAG|SAFETY CAR|VIRTUAL/i.test(msg), flag = !!d.flag;
  e.className = "ev" + (bad ? " bad" : flag ? " flag" : ""); e.textContent = msg;
  list.insertBefore(e, list.firstChild);
  while (list.children.length > 5) list.removeChild(list.lastChild);
  if (bad) say(msg, true);
}

function onMessage(topic, d) {
  if (topic === "car.position") onPosition(d);
  else if (topic === "telemetry.raw") tel[d.driver] = d;
  else if (topic === "race.laps") { if (d.lap_duration) lastLap[d.driver] = d.lap_duration; }
  else if (topic === "race.events") addEvent(d);
  else if (topic === "telemetry.predictions") {
    (preds[d.driver] = preds[d.driver] || {})[d.metric] = d;
    if (d.driver === selected && d.message && d.metric !== "next_lap_time") say(`${d.driver}: ${d.message}`, d.metric === "pit_recommended" && d.value === 1);
  }
}

let ws, retry = 0;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { retry = 0; $("status").className = "on"; $("status").lastElementChild.textContent = "LINK ONLINE"; say("Telemetry link established."); };
  ws.onmessage = (ev) => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch (e) { return; } // ignore a bad frame
    for (const m of Array.isArray(frame) ? frame : [frame]) {
      try { onMessage(m.topic, m.data); } catch (e) { /* one bad message must not drop the rest */ }
    }
  };
  ws.onclose = () => { $("status").className = ""; $("status").lastElementChild.textContent = "LINK OFFLINE"; setTimeout(connect, Math.min(5000, 1000 + 500 * ++retry)); };
}

// ---------- boot ----------
async function boot() {
  try { (await (await fetch("/api/drivers")).json()).forEach((d) => info.set(d.code, d)); } catch (e) { /* colours fall back to white */ }
  for (;;) {
    try {
      const r = await fetch("/api/track"); if (!r.ok) throw new Error(r.status);
      const t = await r.json(); buildTrack(t.points);
      $("circuit").textContent = `${t.circuit} | ${t.session} | ${t.date}`; break;
    } catch (e) { $("waitmsg").textContent = "Building the circuit from OpenF1 data..."; await new Promise((r) => setTimeout(r, 3000)); }
  }
  $("waitmsg").textContent = "Circuit ready. Waiting for the producer...";
  connect();
}
boot();

// ---------- frame loop ----------
const clock = new THREE.Clock(), v = new THREE.Vector3(), back = new THREE.Vector3(), want = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, clock.getDelta());
  cars.forEach((c, code) => {
    c.pos.lerp(c.target, 1 - Math.exp(-dt * 9));
    c.heading = lerpAngle(c.heading, c.want, 1 - Math.exp(-dt * 8));
    c.group.position.copy(c.pos); c.group.rotation.y = c.heading;
    const t = tel[code] || {}, speed = t.speed || 0, ud = c.group.userData;
    // wheels turn with the speed, the rear light and the brake discs follow the brake pedal
    const spin = (speed / 3.6) * dt / (0.36 * 2.4);
    ud.wheels.forEach((w) => { w.rotation.x += spin; });
    const brk = Math.min(1, (t.brake || 0) / 100);
    ud.brakeMat.color.setRGB(0.22 + brk * 3.2, 0.03 + brk * 0.1, 0.04 + brk * 0.1);
    ud.glow.emissiveIntensity = brk * 3;
    updateTrail(c, speed, dt);
    if (fx && brk > 0.7 && speed > 170) for (let k = 0; k < 2; k++) if (Math.random() < 0.6) emitSpark(c.pos.x, c.pos.y, c.pos.z, Math.sin(c.heading), Math.cos(c.heading));
    v.copy(c.pos); v.y += 4; v.project(camera);
    const on = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    c.label.style.display = on ? "block" : "none";
    if (on) c.label.style.transform = `translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight - 22}px) translateX(-50%)`;
  });
  updateSparks(dt);
  sky.position.copy(camera.position);
  const car = cars.get(selected);
  let targetFov = 60;
  if (mode === "chase" && car) {
    const sx = Math.sin(car.heading), sz = Math.cos(car.heading), kmh = (tel[selected] || {}).speed || 0, k = Math.min(1, kmh / 340);
    back.set(car.pos.x - sx * (24 + k * 6), car.pos.y + 9 - k * 2, car.pos.z - sz * (24 + k * 6));
    camera.position.lerp(back, 1 - Math.exp(-dt * 3.5));
    if (k > 0.75) camera.position.y += (Math.random() - 0.5) * 0.05 * (k - 0.75) * 4; // a little rumble at top speed
    want.set(car.pos.x + sx * 14, car.pos.y + 2, car.pos.z + sz * 14); camera.lookAt(want);
    targetFov = 58 + k * 16;                       // the view opens up with speed
  } else if (mode === "orbit") controls.update();
  if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 4)); camera.updateProjectionMatrix(); }
  updateHud();
  composer.render();
}
function updateHud() {
  document.querySelectorAll("#drvlist .kmh").forEach((e) => { const t = tel[e.id.slice(2)]; if (t) e.textContent = Math.round(t.speed); });
  const t = tel[selected], p = preds[selected] || {};
  if (t) {
    set("spv", String(Math.round(t.speed)));
    set("gear", t.gear > 0 ? String(t.gear) : "N");
    bar("thrbar", t.throttle); bar("brkbar", t.brake); bar("rpmbar", t.rpm / 130);
    if (t.tyre_wear != null) { set("pwear", t.tyre_wear.toFixed(0) + "%"); bar("wearbar", t.tyre_wear); }
  }
  set("lastlap", "LAST " + (lastLap[selected] ? fmtTime(lastLap[selected]) : "--"));
  set("pnext", p.next_lap_time ? fmtTime(p.next_lap_time.value) : "--");
  set("pleft", p.tyre_laps_left ? p.tyre_laps_left.value.toFixed(1) : "--");
  const alert = p.pit_recommended && p.pit_recommended.value === 1;
  const pit = $("pit"), cls = alert ? "alert" : "", txt = alert ? "PIT WINDOW OPEN" : "TYRES OK";
  if (pit.className !== cls) pit.className = cls;
  set("pit", txt);
  updateStrategy(p.mc_best_pit_lap, p.mc_gain_s, p.mc_win_prob);
}

// Monte Carlo panel: redrawn only when a new simulation arrives for the selected driver.
let mcShown = null;
function updateStrategy(best, gain, prob) {
  if (best === mcShown) return;
  mcShown = best;
  $("mc").hidden = !best;
  if (!best) return;
  set("mcbest", best.value ? "LAP " + best.value : "STAY OUT");
  set("mcgain", best.value && gain ? "+" + gain.value.toFixed(1) + " s" : "--");
  set("mcprob", best.value && prob ? Math.round(prob.value * 100) + "% OF RUNS" : "--");
  drawCurve(best.curve || [], best.value);
}
function drawCurve(curve, best) {
  const svg = $("mcsvg"), W = 240, H = 78, L = 6, R = 6, T = 8, B = 16;
  if (curve.length < 2) { svg.textContent = ""; return; }
  const lo = Math.min(0, ...curve.map((c) => c[1])), hi = Math.max(0.1, ...curve.map((c) => c[1]));
  const x = (i) => L + (i / (curve.length - 1)) * (W - L - R);
  const y = (g) => T + (1 - (g - lo) / (hi - lo)) * (H - T - B);
  const pts = curve.map((c, i) => `${x(i).toFixed(1)},${y(c[1]).toFixed(1)}`);
  let s = `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  s += `<polygon class="area" points="${L},${y(0)} ${pts.join(" ")} ${W - R},${y(0)}"/>`;
  s += `<polyline class="line" points="${pts.join(" ")}"/>`;
  const k = curve.findIndex((c) => c[0] === best);
  if (k >= 0) s += `<line class="bestline" x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${H - B}"/><circle class="best" cx="${x(k)}" cy="${y(curve[k][1])}" r="3"/>`;
  s += `<text x="${L}" y="${H - 3}">L${curve[0][0]}</text><text x="${W - R}" y="${H - 3}" text-anchor="end">L${curve[curve.length - 1][0]}</text>`;
  s += `<text x="${W - R}" y="${T - 1}" text-anchor="end">+${hi.toFixed(0)} s</text>`;
  svg.innerHTML = s;
}
frame();
</script>
