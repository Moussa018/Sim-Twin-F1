services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: f1-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        create() {
          t=$$1; p=$$2; shift 2
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic $$t --partitions $$p --replication-factor 1 "$$@"
        }
        create telemetry.raw 6 --config retention.ms=86400000
        create telemetry.latest 3 --config cleanup.policy=compact --config min.cleanable.dirty.ratio=0.01 --config segment.ms=60000
        create race.laps 3
        create race.events 1
        create telemetry.dlq 1 --config retention.ms=604800000
        create telemetry.kpi 3
        create telemetry.predictions 3

  producer:
    build: ./producer
    container_name: f1-producer
    environment:
      KAFKA_BROKERS: kafka:19092
      # DRIVERS: VER,NOR   # optional filter, default = all drivers
      # SPEED: "1"         # replay speed
      # SESSION_KEY: latest
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sink:
    build: ./sink
    container_name: f1-sink
    environment:
      KAFKA_BROKERS: kafka:19092
      PG_DSN: host=timescaledb dbname=f1 user=f1 password=f1pass
    ports:
      - "8003:8003"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_started
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: f1-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1pass
      POSTGRES_DB: f1
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: f1-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: f1-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, timescaledb]

volumes:
  tsdb-data:
  grafana-data:
