global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Added in later steps (host.docker.internal = apps running on your machine)
  - job_name: f1-producer
    static_configs:
      - targets: ["producer:8000"]
  - job_name: f1-sink
    static_configs:
      - targets: ["sink:8003"]
  - job_name: f1-streams
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: f1-predictor
    static_configs:
      - targets: ["predictor:8002"]
