apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: f1
    secureJsonData:
      password: f1pass
    jsonData:
      database: f1
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    isDefault: true
